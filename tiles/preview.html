<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale-1">
<title>卡卡颂地图素材预览</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: #f4f1e8; }
  h1 { font-size: 1.3rem; }
  #grid { display: flex; flex-wrap: wrap; gap: 1rem; }
  figure { margin: 0; text-align: center; }
  img, .empty { width: 160px; height: 160px; border: 3px solid #222; display: block; background: #fff; }
  .empty { line-height: 160px; color: #999; border-style: dashed; font-size: .8rem; }
  figcaption { margin-top: .3rem; font-size: .9rem; }
  p.hint { color: #666; }
  code { background: #e8e4d8; padding: .1rem .4rem; }
</style>
</head>
<body>
<h1>卡卡颂地图素材（CogView-3-Flash 生成）</h1>
<p class="hint">空框表示还没生成：在项目根目录跑 <code>BIGMODEL_API_KEY=你的key node gen-tiles.js</code></p>
<div id="grid"></div>
<script>
for (const [file, label] of [['grass', '草地'], ['road', '道路'], ['city', '城市'], ['monastery', '修道院'], ['river', '河流']]) {
  const fig = document.createElement('figure');
  const img = new Image();
  img.src = file + '.png';
  img.onerror = () => { const d = document.createElement('div'); d.className = 'empty'; d.textContent = '未生成'; img.replaceWith(d); };
  fig.append(img, Object.assign(document.createElement('figcaption'), { textContent: label }));
  grid.append(fig);
}
</script>
</body>
</html>
